# Push a tag like v1.2.0 -> tests, build the MSI, publish a GitHub Release.
# Installed copies of Gaming Mode pick it up automatically (within 12 hours, or via "Check for updates").
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # A release published earlier (e.g. with build\release.ps1) is never replaced: people may already
      # have downloaded and checksum-checked that installer.
      - name: Check for an existing release
        id: existing
        shell: pwsh
        run: |
          gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::notice::${{ github.ref_name }} is already published - leaving it as it is."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Build installer
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3" }
          ./build/publish.ps1 -Version $version -Installer
          $msi = "artifacts/GamingMode-$version-x64.msi"
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          "$hash  GamingMode-$version-x64.msi" | Set-Content -NoNewline "$msi.sha256"
          "MSI=$msi" >> $env:GITHUB_ENV

      - name: Publish release
        if: steps.existing.outputs.exists == 'false'
        shell: pwsh
        run: |
          gh release create '${{ github.ref_name }}' $env:MSI "$env:MSI.sha256" --title "Gaming Mode ${{ github.ref_name }}" --generate-notes
